<svg xmlns="http://www.w3.org/2000/svg" width="680" height="24" viewBox="0 0 680 24" role="img" aria-label="animated divider">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0">
        <animate attributeName="offset" values="0;1" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="1">
        <animate attributeName="offset" values="0;0.5;1;0.5;0" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0">
        <animate attributeName="offset" values="0;1" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <line x1="10" y1="12" x2="670" y2="12" stroke="url(#lg)" stroke-width="2" opacity="0.9"/>
  <circle r="3.5" fill="#00E5FF">
    <animate attributeName="cx" values="8;672;8" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="12;12;12" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="10" fill="none" stroke="#00E5FF" opacity="0.5">
    <animate attributeName="cx" values="8;672;8" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="12;12;12" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#8B5CF6">
    <animate attributeName="cx" values="672;8;672" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="12;12;12" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>