<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="orbiting system">
  <circle cx="150" cy="150" r="50" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.35"/>
  <circle cx="150" cy="150" r="90" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.3" stroke-dasharray="6 14"/>
  <circle cx="150" cy="150" r="130" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.18" stroke-dasharray="2 10"/>
  <circle cx="150" cy="150" r="5" fill="#00E5FF">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="6s" repeatCount="indefinite"/>
    <circle cx="150" cy="55" r="6" fill="#00E5FF" opacity="0.9"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 150 150" to="0 150 150" dur="9s" repeatCount="indefinite"/>
    <circle cx="150" cy="245" r="5" fill="#8B5CF6" opacity="0.9"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="12s" repeatCount="indefinite"/>
    <circle cx="280" cy="150" r="4" fill="#27C93F"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 150 150" to="0 150 150" dur="15s" repeatCount="indefinite"/>
    <circle cx="20" cy="150" r="3" fill="#FFBD2E"/>
  </g>
</svg>